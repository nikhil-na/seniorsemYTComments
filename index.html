<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Comment Sentiment Analyzer</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-gradient-primary">
    <div class="container py-5">
      <!-- Header -->
      <header class="text-center text-white mb-5">
        <h1 class="display-4 fw-bold mb-3">
          <i class="bi bi-youtube text-danger"></i> YouTube Comment Sentiment
          Analyzer
        </h1>
        <p class="lead opacity-75">
          Analyze and cluster YouTube comments by sentiment
        </p>
      </header>

      <!-- Input Section -->
      <div class="card shadow-lg mb-4">
        <div class="card-body p-4">
          <div class="row g-3">
            <div class="col-md-7">
              <input
                type="text"
                id="videoUrl"
                class="form-control form-control-lg"
                placeholder="Enter YouTube URL (e.g., https://www.youtube.com/watch?v=...)"
              />
            </div>
            <div class="col-md-3">
              <input
                type="number"
                id="numClusters"
                class="form-control form-control-lg"
                placeholder="Clusters (default: 4)"
                min="2"
                max="10"
                value="4"
              />
            </div>
            <div class="col-md-2">
              <button id="analyzeBtn" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-search"></i> Analyze
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="loading" class="card shadow-lg mb-4 d-none">
        <div class="card-body text-center p-5">
          <div
            class="spinner-border text-primary mb-3"
            role="status"
            style="width: 3rem; height: 3rem"
          >
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="lead mb-0">Analyzing comments...</p>
        </div>
      </div>

      <!-- Error Alert -->
      <div
        id="error"
        class="alert alert-danger alert-dismissible fade d-none"
        role="alert"
      >
        <span id="errorMessage"></span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>

      <!-- Results Section -->
      <div id="results" class="d-none">
        <!-- Video Section -->
        <div class="card shadow-lg mb-4">
          <div class="card-body p-4">
            <h2 class="card-title mb-4">
              <i class="bi bi-play-circle"></i> Video
            </h2>
            <div class="ratio ratio-16x9 mb-4">
              <div id="videoContainer"></div>
            </div>
            <div class="row g-3">
              <div class="col-md-4">
                <p class="mb-0">
                  <strong><i class="bi bi-film"></i> Video ID:</strong>
                  <span id="videoId" class="badge bg-secondary ms-2"></span>
                </p>
              </div>
              <div class="col-md-4">
                <p class="mb-0">
                  <strong
                    ><i class="bi bi-chat-dots"></i> Total Comments:</strong
                  >
                  <span id="totalComments" class="badge bg-info ms-2"></span>
                </p>
              </div>
              <div class="col-md-4">
                <p class="mb-0">
                  <strong><i class="bi bi-diagram-3"></i> Clusters:</strong>
                  <span
                    id="numClustersDisplay"
                    class="badge bg-primary ms-2"
                  ></span>
                </p>
              </div>
            </div>
          </div>
        </div>

        <!-- Statistics Section -->
        <div class="card shadow-lg mb-4">
          <div class="card-body p-4">
            <h2 class="card-title mb-4">
              <i class="bi bi-bar-chart"></i> Statistics
            </h2>
            <div id="statistics" class="row g-3"></div>
          </div>
        </div>

        <!-- Clusters Section -->
        <div class="card shadow-lg mb-4">
          <div class="card-body p-4">
            <h2 class="card-title mb-4">
              <i class="bi bi-collection"></i> Comment Clusters
            </h2>
            <div id="clustersContainer" class="row g-4"></div>
          </div>
        </div>

        <!-- All Comments Section - Hidden since comments are now in cluster cards -->
        <div class="card shadow-lg mb-4 d-none">
          <div class="card-body p-4">
            <h2 class="card-title mb-4">
              <i class="bi bi-chat-left-text"></i> All Comments
            </h2>
            <div class="btn-group mb-4" role="group">
              <button
                class="btn btn-outline-primary active filter-btn"
                data-filter="all"
              >
                <i class="bi bi-list-ul"></i> All
              </button>
              <button
                class="btn btn-outline-success filter-btn"
                data-filter="positive"
              >
                <i class="bi bi-emoji-smile"></i> Positive
              </button>
              <button
                class="btn btn-outline-secondary filter-btn"
                data-filter="neutral"
              >
                <i class="bi bi-emoji-neutral"></i> Neutral
              </button>
              <button
                class="btn btn-outline-danger filter-btn"
                data-filter="negative"
              >
                <i class="bi bi-emoji-frown"></i> Negative
              </button>
            </div>
            <div id="commentsContainer"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
